<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>環境守護者 - AI 拍照辨識</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        /* 全域樣式 */
        * { box-sizing: border-box; }
        body { font-family: sans-serif; text-align: center; background: #222; color: white; margin: 0; padding: 10px; }
        
        #video-container { position: relative; display: inline-block; width: 100%; max-width: 500px; border: 5px solid #444; border-radius: 15px; overflow: hidden; background: #000; }
        video { width: 100%; height: auto; display: block; }
        #status { color: #00ff00; font-weight: bold; margin: 10px 0; min-height: 1.2em; }
        
        .overlay-ui { margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
        
        /* --- 核心修改：三顆按鈕的佈局 --- */
        .button-group { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            width: 95%; 
            max-width: 450px; 
        }
        
        /* 縮小後的拍照按鈕 */
        .btn-capture { 
            padding: 12px 10px; 
            font-size: 0.9rem; 
            background: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            flex: 2; /* 佔比較大 */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        /* 新增的結算按鈕 */
        .btn-settle { 
            padding: 12px 10px; 
            font-size: 0.9rem; 
            background: #2980b9; 
            color: white; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            flex: 1; /* 較小 */
            font-weight: bold;
        }

        .btn-capture:active, .btn-settle:active { transform: scale(0.95); opacity: 0.8; }
        .btn-capture:disabled { background: #7f8c8d; }

        /* 相簿按鈕微調 */
        #album-btn { 
            width: 55px; height: 55px; 
            background: #f39c12; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 1.6rem; 
            cursor: pointer; 
            flex-shrink: 0; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* --- 結算畫面 Overlay --- */
        #settle-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: none; 
            flex-direction: column; justify-content: center; align-items: center; 
            z-index: 30000; padding: 20px; backdrop-filter: blur(8px);
        }
        .settle-box { 
            background: #333; width: 100%; max-width: 320px; 
            border-radius: 20px; border: 2px solid #2980b9; padding: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .settle-title { color: #3498db; font-size: 1.4rem; font-weight: bold; margin-bottom: 20px; }
        .settle-list { text-align: left; margin: 15px 0; line-height: 1.8; border-top: 1px solid #555; padding-top: 15px; max-height: 200px; overflow-y: auto; }
        .settle-total { font-size: 1.1rem; font-weight: bold; color: #f1c40f; margin-top: 15px; border-top: 1px solid #555; padding-top: 10px; }
        
        .settle-btns { display: flex; gap: 12px; margin-top: 25px; }
        .btn-cancel { background: #95a5a6; flex: 1; padding: 12px; border-radius: 10px; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-confirm { background: #2980b9; flex: 1; padding: 12px; border-radius: 10px; color: white; border: none; font-weight: bold; cursor: pointer; }

        /* 相簿與叮嚀樣式 (保持原本邏輯) */
        #gallery-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: none; flex-direction: column; z-index: 20000; }
        .gallery-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #222; border-bottom: 2px solid #f39c12; }
        #gallery-content { flex: 1; padding: 15px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; align-content: start; overflow-y: auto; }
        .photo-item { width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #444; }
        .photo-item img { width: 100%; height: 100%; object-fit: contain; }
        .photo-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); font-size: 0.8rem; padding: 5px; color: #00ff00; }
        .pagination-bar { padding: 15px; background: #222; display: flex; justify-content: center; align-items: center; gap: 15px; border-top: 1px solid #444; }
        .page-btn { background: #f39c12; color: white; border: none; padding: 8px 15px; border-radius: 5px; }
        #notice-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10000; }
        .notice-content { background: #333; padding: 25px; border-radius: 15px; border: 2px solid #27ae60; width: 80%; }
        canvas { display: none; }
    </style>
</head>
<body>

    <!-- 結算畫面 Overlay -->
    <div id="settle-overlay">
        <div class="settle-box">
            <div class="settle-title">📊 辨識結算</div>
            <div id="settle-stats" class="settle-list">
                <!-- 動態插入統計結果 -->
            </div>
            <div id="settle-count" class="settle-total"></div>
            <div class="settle-btns">
                <button class="btn-cancel" onclick="closeSettlement()">返回</button>
                <button class="btn-confirm" onclick="confirmSettlement()">確定結算</button>
            </div>
        </div>
    </div>

    <!-- 拍攝叮嚀 (同之前) -->
    <div id="notice-overlay">
        <div class="notice-content">
            <h3>🌟 拍攝叮嚀</h3>
            <p>請將垃圾放置於光線充足的地方再進行拍攝，以提高辨識準確度。</p>
            <button class="btn-capture" style="width:100%" onclick="closeNotice()">我知道了</button>
        </div>
    </div>

    <!-- 相簿畫面 (同之前) -->
    <div id="gallery-overlay">
        <div class="gallery-header">
            <h3 style="margin:0; color:#f39c12;">環境守護者紀錄</h3>
            <button class="btn-cancel" style="padding: 5px 15px;" onclick="closeGallery()">關閉</button>
        </div>
        <div id="gallery-content"></div>
        <div class="pagination-bar">
            <button id="prevBtn" class="page-btn" onclick="changePage(-1)">前一頁</button>
            <span id="pageInfo">第 1 頁</span>
            <button id="nextBtn" class="page-btn" onclick="changePage(1)">後一頁</button>
        </div>
    </div>

    <h1>AI 垃圾辨識系統</h1>
    <div id="status">正在初始化相機...</div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <canvas id="canvas"></canvas>

    <div class="overlay-ui">
        <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 10px;">對準垃圾後，點擊下方進行辨識：</p>
        <div class="button-group">
            <!-- 參考 image_af39b8.jpg 的相簿圓鈕設計 -->
            <div id="album-btn" onclick="openGallery()">🖼️</div>
            <button id="captureBtn" class="btn-capture">📷 拍照並辨識</button>
            <button id="settleBtn" class="btn-settle" onclick="showSettlement()">✅ 結算</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWLI1eL8c7SGwxTd06rwRFgf0_KZrjNxY",
            authDomain: "environmentguardian-bf374.firebaseapp.com",
            databaseURL: "https://environmentguardian-bf374-default-rtdb.firebaseio.com",
            projectId: "environmentguardian-bf374",
            storageBucket: "environmentguardian-bf374.firebasestorage.app",
            messagingSenderId: "527271524460",
            appId: "1:527271524460:web:aea82c6e312de800780049" 
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status');
        const captureBtn = document.getElementById('captureBtn');

        let allPhotos = []; 
        let currentPage = 1;
        const itemsPerPage = 6;
        let isWaitingForThisResult = false;

        // --- 核心修改：結算邏輯 ---
        function showSettlement() {
            const statsContainer = document.getElementById('settle-stats');
            const countContainer = document.getElementById('settle-count');
            statsContainer.innerHTML = "";
            
            if (allPhotos.length === 0) {
                statsContainer.innerHTML = "<p style='text-align:center; color:#888;'>目前沒有辨識紀錄</p>";
                countContainer.innerText = "總計：0 張";
            } else {
                // 1. 統計各標籤數量
                const summary = {};
                allPhotos.forEach(p => {
                    summary[p.label] = (summary[p.label] || 0) + 1;
                });

                // 2. 顯示標籤列表
                for (const [label, count] of Object.entries(summary)) {
                    statsContainer.innerHTML += `<div>📍 ${label}：<b>${count}</b> 張</div>`;
                }
                countContainer.innerText = `📸 共拍攝：${allPhotos.length} 張照片`;
            }
            document.getElementById('settle-overlay').style.display = 'flex';
        }

        function closeSettlement() {
            document.getElementById('settle-overlay').style.display = 'none';
        }

        function confirmSettlement() {
            // 封裝要回傳給 Unity 的資料
            const dataToUnity = {
                totalCount: allPhotos.length,
                photoData: allPhotos // 包含每張圖的 base64 和標籤
            };

            const jsonString = JSON.stringify(dataToUnity);

            // 呼叫 Unity (適用於 Unity WebGL 或 WebView 橋接)
            try {
                if (window.unityInstance) {
                    // WebGL 模式：發送訊息到名為 "GameManager" 的物件上的 "OnSettlementComplete" 方法
                    window.unityInstance.SendMessage('GameManager', 'OnSettlementComplete', jsonString);
                } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.unityControl) {
                    // iOS WebView 模式
                    window.webkit.messageHandlers.unityControl.postMessage(jsonString);
                } else if (typeof Unity !== 'undefined') {
                    // Android WebView (或其他橋接套件)
                    Unity.call(jsonString);
                }
            } catch (e) {
                console.log("Unity 通訊嘗試失敗（非環境內）：", e);
            }

            // 關閉網頁
            setTimeout(() => { window.close(); }, 500);
        }

        // --- 相機與辨識 (同之前) ---
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                video.srcObject = stream;
                statusText.innerText = "相機就緒";
                setTimeout(() => { document.getElementById('notice-overlay').style.display = 'flex'; }, 500);
            } catch (err) { statusText.innerText = "錯誤: " + err.message; }
        }

        captureBtn.onclick = function() {
            statusText.innerText = "正在分析...";
            captureBtn.disabled = true;
            isWaitingForThisResult = true;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const base64Data = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
            database.ref('ScanControl').update({ isWaitingForScan: true, imgData: base64Data, timestamp: Date.now() });
        };

        database.ref('ScanControl').on('value', (snapshot) => {
            const data = snapshot.val();
            if (isWaitingForThisResult && data && data.isWaitingForScan === false && data.scannedResult) {
                isWaitingForThisResult = false;
                statusText.innerText = "辨識完成：" + data.scannedResult;
                captureBtn.disabled = false;
                if (data.resultImg) {
                    allPhotos.unshift({ img: 'data:image/jpeg;base64,' + data.resultImg, label: data.scannedResult });
                    database.ref('ScanControl/resultImg').set(null);
                }
            }
        });

        // 輔助函式
        function closeNotice() { document.getElementById('notice-overlay').style.display = 'none'; }
        function openGallery() { document.getElementById('gallery-overlay').style.display = 'flex'; renderGallery(); }
        function closeGallery() { document.getElementById('gallery-overlay').style.display = 'none'; }
        function changePage(s) { currentPage += s; renderGallery(); }
        function renderGallery() {
            const container = document.getElementById('gallery-content');
            container.innerHTML = "";
            const start = (currentPage - 1) * itemsPerPage;
            const currentItems = allPhotos.slice(start, start + itemsPerPage);
            currentItems.forEach(p => {
                const div = document.createElement('div');
                div.className = 'photo-item';
                div.innerHTML = `<img src="${p.img}"><div class="photo-label">${p.label}</div>`;
                container.appendChild(div);
            });
            document.getElementById('pageInfo').innerText = `第 ${currentPage} 頁`;
            document.getElementById('prevBtn').disabled = (currentPage === 1);
            document.getElementById('nextBtn').disabled = (start + itemsPerPage >= allPhotos.length);
        }

        window.onload = startCamera;
    </script>
</body>
</html>
