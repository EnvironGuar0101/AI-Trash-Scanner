<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>環境守護者 - AI 拍照辨識</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-storage-compat.js"></script>
    <style>
        /* 全域樣式 */
        * { box-sizing: border-box; }
        body { font-family: sans-serif; text-align: center; background: #222; color: white; margin: 0; padding: 20px; }
        
        #video-container { 
            position: relative; 
            display: inline-block; 
            width: 100%; 
            max-width: 400px;      
            aspect-ratio: 1 / 1;  
            border: 5px solid #444; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
        }
        video { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        #status { color: #00ff00; font-weight: bold; margin: 10px 0; min-height: 1.2em; }
        .overlay-ui { margin-top: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .button-group { display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%; max-width: 450px; }

        .btn-capture { 
            padding: 12px 20px; font-size: 1rem; background: #27ae60; color: white; 
            border: none; border-radius: 50px; cursor: pointer; flex: 1; transition: 0.3s;
        }
        .btn-capture:active { background: #2ecc71; transform: scale(0.95); }
        .btn-capture:disabled { background: #7f8c8d; cursor: not-allowed; }

        #album-btn, #settle-btn { 
            width: 60px; height: 60px; border-radius: 50%; display: flex; 
            justify-content: center; align-items: center; font-size: 1.8rem; 
            cursor: pointer; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
            transition: 0.3s; border: none;
        }
        #album-btn { background: #f39c12; }
        #settle-btn { background: #2980b9; color: white; }
        #album-btn:active, #settle-btn:active { transform: scale(0.9); }
        #settle-btn:disabled { background: #7f8c8d !important; cursor: not-allowed; transform: none !important; }

        /* 圖片放大燈箱 */
        #lightbox-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95);
            display: none; justify-content: center; align-items: center; z-index: 50000; cursor: zoom-out;
        }
        #lightbox-img { max-width: 95%; max-height: 85%; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); object-fit: contain; }

        /* 結算畫面 Overlay */
        #settle-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: none; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 30000; backdrop-filter: blur(5px);
        }
        .settle-box { background: #333; padding: 30px; border-radius: 20px; border: 2px solid #2980b9; width: 85%; max-width: 350px; }
        .settle-title { font-size: 1.5rem; color: #2980b9; margin-bottom: 20px; font-weight: bold; }
        .settle-info { text-align: left; margin: 15px 0; line-height: 1.8; border-top: 1px solid #555; padding-top: 15px; }
        .settle-total { font-size: 1.2rem; color: #f1c40f; font-weight: bold; margin-top: 10px; }
        .settle-footer { display: flex; gap: 10px; margin-top: 25px; }
        .btn-s-cancel { background: #e74c3c; flex: 1; padding: 12px; border-radius: 10px; color: white; border: none; cursor: pointer; }
        .btn-s-confirm { background: #27ae60; flex: 1; padding: 12px; border-radius: 10px; color: white; border: none; cursor: pointer; font-weight: bold; }

        /* 相簿介面：2x3 排列 */
        #gallery-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;        
            background: #1a1a1a; display: none; flex-direction: column; z-index: 20000; overflow: hidden;    
        }
        .gallery-header { 
            padding: 12px 20px; display: flex; justify-content: space-between; 
            align-items: center; background: #222; border-bottom: 2px solid #f39c12; 
        }
        #gallery-content { 
            flex: 1; padding: 15px 10px; display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 12px; align-content: start; overflow-y: auto; -webkit-overflow-scrolling: touch;     
            max-width: 340px; margin: 0 auto; width: 100%;
        }
        .photo-item { 
            width: 100%; aspect-ratio: 1 / 1; background: #000; border-radius: 10px; 
            overflow: hidden; border: 1px solid #444; position: relative; cursor: zoom-in; 
        }
        .photo-item img { width: 100%; height: 100%; object-fit: contain; }
        .photo-label { 
            position: absolute; bottom: 0; width: 100%; background: rgba(0, 0, 0, 0.8); 
            font-size: 0.75rem; padding: 4px 0; color: #00ff00; font-weight: bold; 
        }
        .pagination-bar { 
            padding: 12px; background: #222; display: flex; justify-content: center; 
            align-items: center; gap: 15px; border-top: 1px solid #444; 
            padding-bottom: calc(25px + env(safe-area-inset-bottom)); 
        }
        .page-btn { background: #f39c12; color: white; border: none; padding: 8px 22px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem;}
        .page-btn:disabled { background: #444 !important; color: #888 !important; cursor: not-allowed; opacity: 1; }
        
        #notice-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10000; backdrop-filter: blur(5px); }
        .notice-content { background: #333; padding: 30px; border-radius: 20px; border: 2px solid #27ae60; max-width: 85%; }
        canvas { display: none; }
    </style>
</head>
<body>

    <div id="lightbox-overlay" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="放大圖片">
        <p style="position: absolute; bottom: 20px; color: #888;">再按一下返回</p>
    </div>

    <div id="settle-overlay">
        <div class="settle-box">
            <div class="settle-title">📊 任務結算</div>
            <div id="settle-stats" class="settle-info"></div>
            <div id="settle-total-count" class="settle-total"></div>
            <div class="settle-footer">
                <button class="btn-s-cancel" onclick="closeSettlement()">取消結算</button>
                <button class="btn-s-confirm" onclick="confirmSettlement()">確定結算</button>
            </div>
        </div>
    </div>

    <div id="notice-overlay">
        <div class="notice-content">
            <h3>🌟 拍攝叮嚀</h3>
            <p>請將垃圾放置於光線充足的地方再進行拍攝，以提高辨識準確度。</p>
            <button class="btn-capture" style="width:100%" onclick="closeNotice()">我知道了</button>
        </div>
    </div>

    <div id="gallery-overlay">
        <div class="gallery-header">
            <h2 style="margin:0; color:#f39c12; font-size: 1.2rem;">環境守護者紀錄</h2>
            <button class="btn-s-cancel" style="padding: 8px 20px; flex:none;" onclick="closeGallery()">關閉</button>
        </div>
        <div id="gallery-content"></div>
        <div class="pagination-bar">
            <button id="prevBtn" class="page-btn" onclick="changePage(-1)">上一頁</button>
            <span id="pageInfo" style="font-weight: bold; font-size: 0.9rem;">第 1 頁</span>
            <button id="nextBtn" class="page-btn" onclick="changePage(1)">下一頁</button>
        </div>
    </div>

    <h1>AI 垃圾辨識系統</h1>
    <div id="status">正在初始化相機...</div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <canvas id="canvas"></canvas>

    <div class="overlay-ui">
        <p style="font-size: 0.9rem; color: #aaa;">對準垃圾後，點擊下方進行辨識：</p>
        <div class="button-group">
            <div id="album-btn" onclick="openGallery()">🖼️</div>
            <button id="captureBtn" class="btn-capture">📷 拍照並辨識</button>
            <button id="settle-btn" onclick="showSettlement()">📋</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWLI1eL8c7SGwxTd06rwRFgf0_KZrjNxY",
            authDomain: "environmentguardian-bf374.firebaseapp.com",
            databaseURL: "https://environmentguardian-bf374-default-rtdb.firebaseio.com",
            projectId: "environmentguardian-bf374",
            storageBucket: " environmentguardian",
            messagingSenderId: "527271524460",
            appId: "1:527271524460:web:aea82c6e312de800780049" 
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const storage = firebase.storage(); // 初始化 Storage

        const urlParams = new URLSearchParams(window.location.search);
        // 如果網址沒有傳遞 id 參數，則設定成 "default_room"
        const playerId = urlParams.get('id') || "default_room"; 

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status');
        const captureBtn = document.getElementById('captureBtn');
        const settleBtn = document.getElementById('settle-btn'); 
        const galleryOverlay = document.getElementById('gallery-overlay');

        let allPhotos = []; 
        let currentPage = 1;
        const itemsPerPage = 6; 
        let isWaitingForThisResult = false;

        // 【新增判斷】：如果房號是 default_room，直接停用結算按鈕並更改提示樣式
        if (playerId === "default_room") {
            settleBtn.disabled = true;
            settleBtn.style.background = "#7f8c8d";
            settleBtn.title = "無有效房號，無法結算";
            settleBtn.onclick = null; // 移除點擊事件處理
        }

        function openLightbox(imgSrc) {
            const lightbox = document.getElementById('lightbox-overlay');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = imgSrc;
            lightbox.style.display = 'flex';
        }
        function closeLightbox() { document.getElementById('lightbox-overlay').style.display = 'none'; }

        function showSettlement() {
            // 防呆防禦線：如果因任何原因被繞過點擊，依然不執行
            if (playerId === "default_room") return;
            
            const statsContainer = document.getElementById('settle-stats');
            const totalContainer = document.getElementById('settle-total-count');
            statsContainer.innerHTML = "";
            if (allPhotos.length === 0) {
                statsContainer.innerHTML = "<p style='text-align:center;'>目前尚未拍攝任何照片。</p>";
                totalContainer.innerText = "總計：0 張";
            } else {
                const counts = {};
                allPhotos.forEach(p => { counts[p.label] = (counts[p.label] || 0) + 1; });
                for (const label in counts) {
                    statsContainer.innerHTML += `<div>🔹 ${label}: <b>${counts[label]}</b> 張</div>`;
                }
                totalContainer.innerText = `📸 共拍了 ${allPhotos.length} 張照片`;
            }
            document.getElementById('settle-overlay').style.display = 'flex';
        }
        function closeSettlement() { document.getElementById('settle-overlay').style.display = 'none'; }

        function confirmSettlement() {
            if (playerId === "default_room") {
                alert("❌ 無有效房號，不允許結算。");
                return;
            }
            const counts = {};
            allPhotos.forEach(p => { counts[p.label] = (counts[p.label] || 0) + 1; });
            database.ref(`Players/${playerId}/ScanControl/categoryCounts`).set(counts);
            database.ref(`Players/${playerId}/isScanned`).set(true);

            const resultData = { totalPhotos: allPhotos.length, photoDetails: allPhotos, categoryCounts: counts };
            const jsonString = JSON.stringify(resultData);
            try {
                if (window.parent && window.parent.Unity) { window.parent.Unity.call(jsonString); } 
                else if (typeof Unity !== 'undefined') { Unity.SendMessage("GameManager", "OnRecognitionFinished", jsonString); }
            } catch (e) { console.error(e); }
            alert("結算成功！即將關閉頁面。");
            window.close();
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 640 } }, 
                    audio: false 
                });
                video.srcObject = stream;
                
                // 調整相機對接提示語，讓使用者知道目前是公共測試狀態還是專屬房間
                if (playerId === "default_room") {
                    statusText.innerText = "相機已啟動 - 當前為測試模式(無房號無法結算)";
                    statusText.style.color = "#ff9800";
                } else {
                    statusText.innerText = "相機已啟動 - 成功對接專屬房間";
                    statusText.style.color = "#00ff00";
                }
                setTimeout(() => { document.getElementById('notice-overlay').style.display = 'flex'; }, 500);
            } catch (err) { statusText.innerText = "無法開啟相機: " + err.message; }
        }

        function closeNotice() { document.getElementById('notice-overlay').style.display = 'none'; }
        function openGallery() { galleryOverlay.style.display = 'flex'; renderGallery(); }
        function closeGallery() { galleryOverlay.style.display = 'none'; }

        /* =================================================== */
        /* ★【儲存優化】：拍照改為生成 Blob 並上傳至雲端 Storage */
        /* =================================================== */
        captureBtn.onclick = function() {
            statusText.innerText = "正在擷取畫面...";
            captureBtn.disabled = true;
            settleBtn.disabled = true; 

            canvas.width = 640;
            canvas.height = 640;
            const ctx = canvas.getContext('2d');
            const vWidth = video.videoWidth;
            const vHeight = video.videoHeight;
            
            if (!vWidth || !vHeight) {
                alert("❌ 錯誤：相機尚未就緒，請重試或更換系統內建瀏覽器。");
                captureBtn.disabled = false; 
                if (playerId !== "default_room") settleBtn.disabled = false;
                return;
            }

            const minSize = Math.min(vWidth, vHeight);
            const sx = (vWidth - minSize) / 2;
            const sy = (vHeight - minSize) / 2;
            ctx.drawImage(video, sx, sy, minSize, minSize, 0, 0, 640, 640);
            
            // 【核心重構】：不再轉 Base64 文字，直接輸出成二進位 JPEG Blob 檔案
            canvas.toBlob(function(blob) {
                if (!blob) {
                    alert("❌ 錯誤：無法生成圖片檔案。");
                    captureBtn.disabled = false; 
                    if (playerId !== "default_room") settleBtn.disabled = false;
                    return;
                }
                
                statusText.innerText = "辨識中...";
                
                // 產生不重複的檔名
                const filename = `${playerId}_${Date.now()}.jpg`;
                const storageRef = storage.ref().child("scans/" + filename);
                
                // 開始上傳到 Firebase Storage
                storageRef.put(blob).then(snapshot => {
                    // 上傳完成後，向雲端索取公開下載網址 (Download URL)
                    return snapshot.ref.getDownloadURL();
                }).then(downloadURL => {
                    statusText.innerText = "辨識中...";
                    isWaitingForThisResult = true;
                    
                    // 改為寫入 imgUrl，廢棄 imgData！
                    database.ref(`Players/${playerId}/ScanControl`).update({ 
                        isWaitingForScan: true, 
                        imgUrl: downloadURL, 
                        timestamp: Date.now() 
                    });
                }).catch(err => {
                    alert("❌ 雲端儲存上傳失敗：" + err.message + "\n請確認 Storage 權限規則已開啟。");
                    statusText.innerText = "❌ 上傳失敗";
                    captureBtn.disabled = false; 
                    if (playerId !== "default_room") settleBtn.disabled = false;
                });

            }, 'image/jpeg', 0.75); // 品質設定 0.75，兼顧清晰度與大小
        };

        function initResultListener() {
            database.ref(`Players/${playerId}/ScanControl`).on('value', (snapshot) => {
                const data = snapshot.val();
                
                // 這裡加入判斷：只有當房號有效時才根據雲端狀態動態解鎖結算按鈕
                if (playerId === "default_room") {
                    settleBtn.disabled = true;
                } else if (data) { 
                    settleBtn.disabled = (data.isWaitingForScan === true); 
                }

                if (isWaitingForThisResult && data && data.isWaitingForScan === false && data.scannedResult) {
                    isWaitingForThisResult = false;
                    statusText.innerText = "✅ 辨識結果：" + data.scannedResult;
                    captureBtn.disabled = false;
                    if (data.resultImg) {
                        // 支援網址或 base64 回傳格式
                        const newPhoto = {
                            img: data.resultImg.startsWith('http') ? data.resultImg : (data.resultImg.startsWith('data:image') ? data.resultImg : 'data:image/jpeg;base64,' + data.resultImg),
                            label: data.scannedResult
                        };
                        allPhotos.unshift(newPhoto); 
                        renderGallery(); 
                        database.ref(`Players/${playerId}/ScanControl/resultImg`).set(null);
                    }
                }
            });
        }

        function renderGallery() {
            const container = document.getElementById('gallery-content');
            container.innerHTML = ""; 
            const start = (currentPage - 1) * itemsPerPage;
            const currentItems = allPhotos.slice(start, start + itemsPerPage);
            
            if (allPhotos.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; color:#666; margin-top: 50px;">目前尚無紀錄</p>`;
            } else {
                currentItems.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'photo-item';
                    div.onclick = function() { openLightbox(item.img); };
                    div.innerHTML = `<img src="${item.img}"><div class="photo-label">${item.label}</div>`;
                    container.appendChild(div);
                });
            }
            
            const totalPages = Math.ceil(allPhotos.length / itemsPerPage) || 1;
            document.getElementById('pageInfo').innerText = `第 ${currentPage} 頁 / 共 ${totalPages} 頁`;
            document.getElementById('prevBtn').disabled = (currentPage === 1);
            document.getElementById('nextBtn').disabled = (currentPage >= totalPages);
        }

        function changePage(step) { currentPage += step; renderGallery(); }

        window.addEventListener('load', () => {
            startCamera();
            initResultListener();
        });
    </script>
</body>
</html>
